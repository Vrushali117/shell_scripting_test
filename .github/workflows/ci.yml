#GOAL - Build the image for devboard fe and push to docker hub

name: CI

on:
  push: 
    branches: [master]

jobs:
  build-and-push: 
    runs-on: ubuntu-latest
    steps: 
      - name: checkout code
        uses: action/checkout@v7

      - name: Docker setup [login]
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME}}
          password: ${{ secrets.DOCKERHUB_TOKEN}}

    
